# Build an unsigned (debug-signed) APK on every push / pull request and
# publish it as a downloadable workflow artifact. This complements the
# existing Woodpecker pipeline, which runs `./gradlew assembleDebug` but
# does not expose the APK for download. See the commit introducing this
# file for the full rationale.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Which Android build type to assemble"
        type: choice
        default: debug
        options:
          - debug
          - release

env:
  # `push` and `pull_request` events have no inputs; default to `debug`
  # there so CI-for-every-commit stays fast and unsigned-by-design.
  BUILD_TYPE: ${{ inputs.build_type || 'debug' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # `assembleDebug` / `assembleRelease` are the canonical AGP tasks
      # for each build type. A `release` build produced here is
      # *unsigned*: `app/build.gradle.kts` only wires a signing config
      # when the `RELEASE_STORE_FILE` Gradle property is set, and we do
      # not set it in this job. Unsigned release APKs cannot be
      # installed on a device as-is; signing is added opt-in by a
      # follow-up change.
      - run: ./gradlew "assemble${BUILD_TYPE^}"

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ env.BUILD_TYPE }}-apk
          path: app/build/outputs/apk/${{ env.BUILD_TYPE }}/*.apk
