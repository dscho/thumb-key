# Build an unsigned (debug-signed) APK on every push / pull request and
# publish it as a downloadable workflow artifact. This complements the
# existing Woodpecker pipeline, which runs `./gradlew assembleDebug` but
# does not expose the APK for download. See the commit introducing this
# file for the full rationale.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
